<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slice Rush</title>
<style>
:root{--bg:#e9eef4;--pn:#fff;--ink:#12263f;--mut:#51657d;--nav:#12263f;--yel:#ffc533;--org:#e8590c;--ok:#14733a;--bad:#a4281c;--ln:#c5d0dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1a2b;--pn:#16283f;--ink:#eef3f9;--mut:#a9bad0;--ln:#2d4560}}
:root[data-theme=dark]{--bg:#0d1a2b;--pn:#16283f;--ink:#eef3f9;--mut:#a9bad0;--ln:#2d4560}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:clamp(15px,2.3vh,20px)/1.3 "Trebuchet MS","Segoe UI",Verdana,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:2px solid var(--ink);background:var(--pn);border-radius:12px;min-height:44px;padding:4px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover{background:var(--yel);color:#12263f}
button.pri{background:var(--yel);color:#12263f;box-shadow:0 4px 0 var(--ink)}button.pri:hover{background:#fff}
:focus-visible{outline:4px solid var(--org);outline-offset:2px}
.ic{flex:none;filter:drop-shadow(0 0 1.2px #12263f) drop-shadow(0 0 1.2px #12263f)}
.hud{flex:none;background:var(--nav);color:#fff;display:flex;gap:12px;align-items:center;padding:6px 12px;flex-wrap:wrap}
.hud b{font-size:1.2em;display:inline-flex;align-items:center;gap:6px}.sp{flex:1}.hud button{min-height:36px;background:transparent;color:#fff;border-color:#fff}.hud button:hover{background:var(--yel);color:#12263f}
#hs{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
main{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:8px 10px;gap:8px}
.ft{flex:none;text-align:center;font-size:12px;color:var(--mut);padding:3px 8px}
.leg{flex:none;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:clamp(12px,2vh,17px);font-weight:700}
.leg span{display:inline-flex;align-items:center;gap:6px;background:var(--pn);border:2px solid var(--ln);border-radius:20px;padding:2px 10px}
.leg i{width:14px;height:14px;border-radius:4px;border:2px solid #12263f}
.stage{flex:1 0 260px;position:relative;background:#0b1530;border-radius:16px;border:3px solid var(--ink);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%}
#q{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--pn);border:3px solid var(--yel);border-radius:14px;padding:4px 16px;font-size:clamp(17px,3.6vh,30px);font-weight:800;text-align:center;max-width:94%;z-index:2;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.wc{color:#12263f;border-radius:10px;padding:0 10px;font-size:.8em}
#tm{position:absolute;left:0;right:0;top:0;height:8px;background:#fff3;z-index:3}#tm i{display:block;height:100%;width:100%;background:var(--yel)}
#toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);padding:8px 20px;border-radius:12px;font-weight:800;font-size:clamp(16px,3.2vh,26px);text-align:center;z-index:4;max-width:94%;display:none;color:#fff;gap:8px;align-items:center}
#toast.ok{display:flex;background:#14733a}#toast.no{display:flex;background:#a4281c}#toast.nt{display:flex;background:#3a5a94}
.dock{flex:none;display:flex;gap:8px;justify-content:center;align-items:stretch;flex-wrap:wrap}
.pc{flex-direction:column;gap:0;min-width:clamp(80px,11vw,130px);background:#13264a;color:#fff;border:3px solid #2c4470;padding:4px 6px}
.pc:hover{background:#25508f;color:#fff;border-color:#ffc533}.pc:disabled{opacity:.22;cursor:default}.pc:disabled:hover{background:#13264a;border-color:#2c4470}
.pc svg{width:100%;height:clamp(36px,9vh,70px)}.pc b{font-size:1.3em}.pc small{font-weight:800}
.hm{align-items:center;justify-content:center;text-align:center}.hm h1{font-size:clamp(30px,7vh,68px);margin:4px 0}
.big{display:flex;justify-content:center;gap:6px}.big .ic{width:clamp(40px,10vh,90px);height:auto}.stars .ic{width:clamp(30px,6vh,56px)}
.stat{display:grid;grid-template-columns:1fr auto;gap:4px 24px;font-size:1.3em;margin:10px 0;text-align:left}.stat b{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.ov>div{background:var(--pn);border-radius:14px;padding:20px;max-width:440px;width:100%;max-height:92vh;overflow:auto}
.ov label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}.ov input{width:26px;height:26px}
.cf{color:#ffc533;position:absolute;top:100%;pointer-events:none;z-index:5}
@media(prefers-reduced-motion:no-preference){.cf{animation:up 1.3s ease-out forwards}@keyframes up{to{transform:translateY(-90vh) rotate(360deg);opacity:0}}}
</style></head><body><div id="app"></div><div id="tp"></div>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),Rn=a=>a[R(0,a.length-1)],sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]),sl=ms=>new Promise(r=>setTimeout(r,ms)),f=n=>Math.round(n*10)/10;
let cfg={gap:false,snd:true},B=0,S={},AC;
try{Object.assign(cfg,JSON.parse(localStorage.getItem('sr_cfg')||'{}'));B=+localStorage.getItem('sr_best')||0}catch(e){}
const sv=()=>{try{localStorage.setItem('sr_cfg',JSON.stringify(cfg));localStorage.setItem('sr_best',B)}catch(e){}};
function beep(fr,d=.12,t='sine'){if(!cfg.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=fr;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const FT='<div class="ft">© 2026 Slice Rush | Developed by AMSanjeev (Teach For India Fellow 2026–28)</div>';
const IC={gear:'<path fill="currentColor" fill-rule="evenodd" d="M12 2l1.200 2.600 2.800-.8 1 2.800 2.800 1-.8 2.800L21.600 12l-2.600 1.200.8 2.800-2.800 1-1 2.800-2.800-.8L12 22l-1.200-2.600-2.800.8-1-2.800-2.800-1 .8-2.800L2.400 12l2.600-1.200-.8-2.800 2.800-1 1-2.800 2.800.8zM12 15.500a3.500 3.500 0 1 0 0-7 3.500 3.500 0 0 0 0 7z"/>',
star:'<path d="M12 2l3 6.500 7 .9-5.200 4.800 1.400 7L12 17.800 5.800 21.200l1.400-7L2 9.400l7-.9z" fill="#ffc533" stroke="#b8860b" stroke-width="1"/>',
starO:'<path d="M12 2l3 6.500 7 .9-5.200 4.800 1.400 7L12 17.800 5.800 21.200l1.400-7L2 9.400l7-.9z" fill="none" stroke="#9fb3d1" stroke-width="1.500"/>',
heart:'<path d="M12 21S4 15.800 4 10a4.500 4.500 0 0 1 8-2.800A4.500 4.500 0 0 1 20 10c0 5.800-8 11-8 11z" fill="#ff4d5e"/>',
heartO:'<path d="M12 21S4 15.800 4 10a4.500 4.500 0 0 1 8-2.800A4.500 4.500 0 0 1 20 10c0 5.800-8 11-8 11z" fill="none" stroke="#7d8fae" stroke-width="1.800"/>',
flame:'<path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z" fill="#ff7a2f"/><path d="M12 22a3 3 0 0 1-3-3c0-2 2-3 3-5 1 2 3 3 3 5a3 3 0 0 1-3 3z" fill="#ffc533"/>',
trophy:'<path d="M7 3h10v6a5 5 0 0 1-10 0z" fill="#ffc533"/><path d="M7 5H3c0 4 2 6 4 6M17 5h4c0 4-2 6-4 6" fill="none" stroke="#ffc533" stroke-width="2"/><rect x="10.500" y="14" width="3" height="4" fill="#ffc533"/><rect x="7" y="18" width="10" height="3" rx="1" fill="#ffc533"/>',
medal:'<path d="M7 2l5 8 5-8" fill="none" stroke="#ff4d5e" stroke-width="3"/><circle cx="12" cy="15" r="6.500" fill="#ffc533" stroke="#b8860b" stroke-width="1.500"/>',
burst:'<path d="M12 1l2.500 6.500L21 4l-3 6.500L23 12l-5.500 1.500L21 20l-6.500-3.500L12 23l-2.500-6.500L3 20l3.500-6.500L1 12l5.500-1.500L3 4l6.500 3.500z" fill="#ff7a2f"/><circle cx="12" cy="12" r="4" fill="#ffc533"/>',
check:'<circle cx="12" cy="12" r="10" fill="#4be08a"/><path d="M7 12.500l3.200 3.200L17 9" fill="none" stroke="#0b1530" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"/>',
cross:'<circle cx="12" cy="12" r="10" fill="#ff6b5e"/><path d="M8 8l8 8M16 8l-8 8" stroke="#0b1530" stroke-width="2.800" stroke-linecap="round"/>',
spark:'<path d="M12 2l2 7 7 3-7 3-2 7-2-7-7-3 7-3z" fill="#ffc533"/>',
person:'<circle cx="12" cy="8" r="5" fill="#ffc9a0" stroke="#12263f" stroke-width="1.500"/><path d="M3 22c0-5 4-8 9-8s9 3 9 8z" fill="#4aa3ff" stroke="#12263f" stroke-width="1.500"/><path d="M7 6c1-4 9-4 10 0z" fill="#12263f"/>',
undo:'<path d="M9 6L4 11l5 5M4 11h10a6 6 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -2)"/>',
rst:'<path d="M4 12a8 8 0 1 0 2.500-5.800M4 3v6h6" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"/>'};
const I=(n,z=24)=>`<svg class="ic" viewBox="0 0 24 24" width="${z}" height="${z}" aria-hidden="true" style="vertical-align:middle">${IC[n]}</svg>`;
const ty=a=>a==0?'zero':a<90?'acute':a==90?'right':a<180?'obtuse':'straight';
const COL={zero:'#9fb3d1',acute:'#1fd1b9',right:'#ff4d8d',obtuse:'#a77bff',straight:'#ff9f2f'},NM={zero:'Zero',acute:'Acute',right:'Right',obtuse:'Obtuse',straight:'Straight'};
const LEG=`<div class="leg">${[['zero','0°'],['acute','less than 90°'],['right','exactly 90°'],['obtuse','90° to 180°'],['straight','exactly 180°']].map(x=>`<span><i style="background:${COL[x[0]]}"></i>${NM[x[0]]}: ${x[1]}</span>`).join('')}</div>`;
const wedge=a=>{const r=62,cx=75,cy=72,p=a*Math.PI/180,x=cx+r*Math.cos(p),y=cy-r*Math.sin(p),c=COL[ty(a)];return `<svg viewBox="0 0 150 80">${a==0?`<line x1="${cx}" y1="${cy}" x2="${cx+r}" y2="${cy}" stroke="${c}" stroke-width="6" stroke-dasharray="4 8" stroke-linecap="round"/>`:`<path d="M${cx} ${cy}L${cx+r} ${cy}A${r} ${r} 0 0 0 ${f(x)} ${f(y)}Z" fill="${c}" stroke="#0b1530" stroke-width="3"/>`}</svg>`};
/* ---------- screens ---------- */
function home(){clearTimeout(S.tid);S={};$('#app').innerHTML=`<div class="hud"><b>${I('gear',22)} SLICE RUSH</b><span class="sp"></span><button onclick="tp(1)">${I('gear',18)} Teacher</button></div><main class="hm"><h1>SLICE RUSH</h1><div style="font-size:1.2em">Customers want their trays filled with <b>exactly</b> the right slices. Tap slices to fill the tray: no gaps, no overflow!</div>${LEG}<div class="row" style="margin-top:14px"><button class="pri" style="font-size:1.4em;min-height:64px;padding:6px 32px" onclick="start(0)">Play Rush</button><button style="font-size:1.4em;min-height:64px;padding:6px 32px" onclick="start(1)">Chill mode (no timer)</button></div><p>${B?I('trophy',22)+' Best score '+B:I('spark',22)+' Ready for your first shift?'}</p></main>${FT}`}
function start(chill){S={chill,r:0,score:0,lives:3,streak:0,mx:0,ok:0};$('#app').innerHTML=`<div class="hud"><b>${I('gear',22)} SLICE RUSH</b><span class="sp"></span><span id="hs"></span><button onclick="home()">Menu</button></div><main>${LEG}<div class="stage"><svg id="cv" viewBox="0 0 800 460"><g id="g"></g></svg><div id="q"></div><div id="tm"><i></i></div><div id="toast"></div></div><div class="dock" id="dock"></div></main>${FT}`;nextOrder()}
function hud(){$('#hs').innerHTML=`Order ${Math.min(S.r,10)}/10 · ${I('star',18)} ${S.score}${S.chill?'':' · '+I('heart',18).repeat(S.lives)+I('heartO',18).repeat(3-S.lives)} · ${I('flame',18)} ${S.streak}`}
function end(){const w=S.lives>0,st=S.chill?3:(w?S.lives:0);B=Math.max(B,S.score);sv();$('#app').innerHTML=`<div class="hud"><b>${I('gear',22)} SLICE RUSH</b></div><main class="hm"><div class="big">${I(w?'medal':'burst',90)}</div><h1>${w?'Shift complete!':'The shop closed early!'}</h1><div class="big stars">${I('star',56).repeat(st)}${I('starO',56).repeat(3-st)}</div><div class="stat"><span>Score</span><b>${S.score}</b><span>Orders served</span><b>${S.ok} / ${S.r}</b><span>Best streak</span><b>${I('flame',22)} ${S.mx}</b><span>Your best</span><b>${I('trophy',22)} ${B}</b></div><div class="row"><button class="pri" onclick="start(${S.chill?1:0})">Play again</button><button onclick="home()">Menu</button></div></main>${FT}`}
/* ---------- orders ---------- */
function nextOrder(){if(S.lives<=0||S.r>=10)return end();S.r++;S.busy=false;S.placed=[];S.over=null;$('#toast').className='';hud();
 const r=S.r,k=r==1?4:r==2?5:r==3?1:r==4?2:Rn([1,2,2,3,4,5]);let TT,sol;
 if(k==1){TT=90;const a=5*R(2,16);sol=[a,90-a]}else if(k==2){TT=180;const a=5*R(2,34);sol=[a,180-a]}
 else if(k==3){TT=Rn([90,180]);const a=5*R(2,TT/5-4),b=5*R(2,(TT-a-10)/5);sol=[a,b,TT-a-b]}else if(k==4){TT=90;sol=[90]}else{TT=180;sol=[180]}
 const n=sol.length==1?5:6,dc=[];if(Math.random()<.55)dc.push(0);while(sol.length+dc.length<n)dc.push(5*R(1,35));
 S.TT=TT;S.pcs=sh(sol.concat(dc)).map(a=>({a,used:0}));
 const tys=sol.filter(a=>a>0).map(ty);S.want=r>=4&&Math.random()<.6?Rn(tys):null;
 $('#q').innerHTML=`${I('person',30)} ${TT==90?'Corner tray: 90°':'Straight tray: 180°'}${S.want?`<span class="wc" style="background:${COL[S.want]}">Use an ${NM[S.want].toUpperCase()} slice</span>`:''}`;
 dock();draw();if(S.chill)$('#tm').style.display='none';else tmr(Math.max(20,45-r*2.5))}
function tmr(sec){$('#tm').style.display='block';const i=$('#tm i');i.style.transition='none';i.style.width='100%';i.offsetWidth;i.style.transition=`width ${sec}s linear`;i.style.width='0';S.t0=Date.now();S.tl=sec;S.tid=setTimeout(()=>{if(!S.busy)fin(false,'Time up! The customer left.')},sec*1000)}
function dock(){$('#dock').innerHTML=S.pcs.map((p,i)=>`<button class="pc" ${p.used?'disabled':''} onclick="put(${i})">${wedge(p.a)}<b>${p.a}°</b><small style="color:${COL[ty(p.a)]}">${NM[ty(p.a)]}</small></button>`).join('')+`<button onclick="undo()">${I('undo',20)} Undo</button><button onclick="rst()">${I('rst',20)} Reset</button>`}
const tot=()=>S.placed.reduce((a,p)=>a+p.a,0);
function msg(t,c){const e=$('#toast');e.innerHTML=t;e.className=c}
function put(i){if(S.busy)return;const p=S.pcs[i],c=tot();
 if(c+p.a>S.TT){S.over=p.a;S.streak=0;S.score=Math.max(0,S.score-3);beep(170,.25,'sawtooth');msg(`${I('cross',24)} Too big! Only ${S.TT-c}° left in the tray`,'no');hud();draw();setTimeout(()=>{S.over=null;draw()},1100);return}
 p.used=1;S.placed.push({a:p.a,i});beep(400+p.a,.1);if(p.a==0)msg('Zero angle: the slice is flat, it adds nothing','nt');else $('#toast').className='';dock();draw();if(c+p.a==S.TT)serve()}
function undo(){if(S.busy||!S.placed.length)return;S.pcs[S.placed.pop().i].used=0;$('#toast').className='';dock();draw()}
function rst(){if(S.busy)return;S.pcs.forEach(p=>p.used=0);S.placed=[];$('#toast').className='';dock();draw()}
function serve(){const u=S.placed.map(p=>p.a).filter(a=>a>0),TT=S.TT;
 const m=u.length==1?(TT==90?'A right angle fills a corner all by itself!':'A straight angle fills the whole tray!'):u.length==2?`${u.join('° + ')}° = ${TT}°. ${TT==90?'Complementary':'Supplementary'} angles!`:`${u.join('° + ')}° = ${TT}°`;
 if(S.want&&!u.some(a=>ty(a)==S.want))return fin(false,`The customer wanted an ${NM[S.want].toLowerCase()} slice!`);
 const b=S.chill?0:Math.round(10*Math.max(0,1-(Date.now()-S.t0)/1000/S.tl));fin(true,m,b)}
async function fin(ok,m,b=0){if(S.busy&&!ok&&m.startsWith('Time'))return;S.busy=true;clearTimeout(S.tid);
 if(ok){S.streak++;S.mx=Math.max(S.mx,S.streak);S.ok++;const p=10+b+Math.min(S.streak-1,5)*2;S.score+=p;beep(660);setTimeout(()=>beep(880),90);conf();msg(`${I('check',26)} ${m} +${p}`,'ok')}
 else{S.streak=0;if(!S.chill)S.lives--;beep(170,.3,'sawtooth');msg(`${I('cross',26)} ${m}`,'no')}
 hud();draw();await sl(ok?2600:2300);nextOrder()}
function conf(){const s=$('.stage');for(let i=0;i<14;i++){const e=document.createElement('i');e.className='cf';e.innerHTML=I(['star','spark','heart'][i%3],30);e.style.cssText=`left:${R(5,92)}%;animation-delay:${i*40}ms`;s.appendChild(e);setTimeout(()=>e.remove(),1800)}}
/* ---------- drawing ---------- */
const L=(p,q,c,w=6,d='')=>`<line x1="${f(p[0])}" y1="${f(p[1])}" x2="${f(q[0])}" y2="${f(q[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"${d?` stroke-dasharray="${d}"`:''}/>`;
const Tx=(x,y,s,c='#0b1530',z=26)=>`<text x="${f(x)}" y="${f(y)}" font-size="${z}" font-weight="800" fill="${c}" text-anchor="middle">${s}</text>`;
function draw(){const TT=S.TT,cx=400,cy=410,Rr=250;let c=0,h='';
 const P=(a,r)=>[cx+r*Math.cos(a*Math.PI/180),cy-r*Math.sin(a*Math.PI/180)];
 const sec=(a0,a1,r)=>{const p=P(a0,r),q=P(a1,r);return `M${cx} ${cy}L${f(p[0])} ${f(p[1])}A${r} ${r} 0 0 0 ${f(q[0])} ${f(q[1])}Z`};
 h+=`<path d="${sec(0,TT,Rr+16)}" fill="#1b2f57" stroke="#4a6a9e" stroke-width="3"/>`;
 S.placed.forEach(p=>{const a=p.a;if(a==0){const q=P(c,Rr);h+=L([cx,cy],q,'#e8f0ff',4,'6 8')+Tx(q[0]+(c==0?-10:10),q[1]-10,'0°','#e8f0ff',22);return}
  const col=COL[ty(a)],m=P(c+a/2,Rr*.62),q0=P(c,Rr),q1=P(c+a,Rr);
  h+=`<path d="${sec(c,c+a,Rr-6)}" fill="${col}" stroke="#0b1530" stroke-width="3"/><path d="M${f(q0[0])} ${f(q0[1])}A${Rr} ${Rr} 0 0 0 ${f(q1[0])} ${f(q1[1])}" fill="none" stroke="#d99a4e" stroke-width="12" stroke-linecap="round"/>`+Tx(m[0],m[1]+8,a+'°','#0b1530',a<15?16:30)+(a>=20?Tx(m[0],m[1]+30,NM[ty(a)],'#0b1530',16):'');c+=a});
 if(c<TT){const m=P(c+(TT-c)/2,Rr*.5);h+=`<path d="${sec(c,TT,Rr)}" fill="#fff" fill-opacity=".07" stroke="#9fb3d1" stroke-width="3" stroke-dasharray="10 8"/>`+Tx(m[0],m[1]+16,cfg.gap?(TT-c)+'°':'?','#e8f0ff',54)}
 if(S.over)h+=`<path d="${sec(c,c+S.over,Rr)}" fill="#ff3b4e" fill-opacity=".55" stroke="#ff3b4e" stroke-width="4" stroke-dasharray="8 6"/>`;
 h+=L([cx,cy],P(0,Rr+36),'#e8f0ff',6)+L([cx,cy],P(TT,Rr+36),'#e8f0ff',6)+(TT==90?`<path d="M440 410V370H400" fill="none" stroke="#fff" stroke-width="4"/>`:'')+`<circle cx="${cx}" cy="${cy}" r="11" fill="#ffc533" stroke="#0b1530" stroke-width="3"/>`+Tx(cx,448,`Filled ${c}° of ${TT}°`,'#e8f0ff',22);
 $('#g').innerHTML=h}
function tp(o){const t=$('#tp');if(!o){t.innerHTML='';return}const ck=(k,l)=>`<label>${l}<input type="checkbox" ${cfg[k]?'checked':''} onchange="cfg.${k}=this.checked;sv()"></label>`;
 t.innerHTML=`<div class="ov"><div><h2>Teacher controls</h2>${ck('gap','Show the size of the empty gap (instead of ?)')}${ck('snd','Sound effects')}<div class="row"><button onclick="B=0;sv();tp();home()">Clear best score</button><button class="pri" onclick="tp()">Done</button></div></div></div>`}
home();
</script></body></html>
